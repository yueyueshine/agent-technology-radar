name: Generate Feeds

on:
  schedule:
    # All feeds (tweets, podcasts, blogs): once daily at 6:17am UTC
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to fetch'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - tweets-only
          - podcasts-only
          - blogs-only

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      # Phase 2A: the rss and github channels need no secrets. This runs BEFORE
      # the key-dependent step below, which is expected to fail until the repo
      # has secrets — a later failure must not stop these feeds being produced.
      # Their outputs are Fetch-layer intermediates (gitignored), read by later
      # steps in this same job.
      - name: Fetch keyless channels
        run: cd scripts && node fetch-channels.js

      - name: Generate feeds
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          POD2TXT_API_KEY: ${{ secrets.POD2TXT_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "all" ]; then
            cd scripts && node generate-feed.js --${{ inputs.mode }}
          else
            cd scripts && node generate-feed.js
          fi

      - name: Normalize signals
        # always(): the key-dependent step above fails while the repo has no
        # secrets, but rss / github still produced feeds this run. A missing
        # feed file is skipped rather than fatal, so this step stays green and
        # whatever it does find wrong is visible in the log.
        if: always()
        run: cd scripts && node normalize-signals.js

      - name: Build signal window
        # `signals.json` (written above) is the DEDUPLICATED product: cross-run
        # dedup means it holds only what is new since the last run, and on a
        # quiet run it is empty. Topical activity is a question about the whole
        # lookback window, not about this run's delta — so clustering gets its
        # own input (plan §4). `--no-dedup` writes no state, so no side effects.
        if: always()
        run: cd scripts && node normalize-signals.js --no-dedup --out signals-window.json

      - name: Cluster topics
        # Phase 3. Reads the window product, never the deduped delta. The step
        # below asserts that, because getting it wrong is silent: the first
        # version consumed signals.json and committed an empty topics.json on
        # every run while the gate stayed green.
        if: always()
        run: cd scripts && node cluster-signals.js --signals signals-window.json

      - name: Build radar
        # Phase 4. Maps the nine frozen topics onto sectors × rings. Reads
        # topics.json and nothing else — no signal is touched here, so this
        # step cannot change what was clustered or weighted.
        if: always()
        run: cd scripts && node build-radar.js

      - name: Assert clustering saw the window, not the delta
        # An integration assertion, not a fixture test: it is the only thing
        # standing between this pipeline and a silently empty product.
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            let window;
            let topics;
            try { window = read("signals-window.json"); } catch { console.log("no window product (no feeds this run)"); process.exit(0); }
            try { topics = read("topics.json"); } catch { console.error("no topics.json"); process.exit(1); }
            if (window.count > 0 && topics.inputSignalCount === 0) {
              console.error(
                "topics.json was built from an empty input while the window holds " +
                window.count + " signal(s) — clustering is reading the deduped delta"
              );
              process.exit(1);
            }
            console.log("clustering input: " + topics.inputSignalCount + " of " + window.count + " windowed signal(s)");
          '

      - name: Assert radar covers all sectors
        # Phase 4's counterpart to the assertion above. radar.json is derived
        # from topics.json inside this same job, so the failure mode is not an
        # empty file but a STALE or partially-covered one: the build ran against
        # a previous run's topics.json, or sectors were dropped on the way. A
        # radar missing sectors looks fine in the log and quietly shrinks the
        # product, so it is asserted rather than eyeballed.
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            let topics;
            let radar;
            try { topics = read("topics.json"); } catch { console.log("no topics.json"); process.exit(1); }
            try { radar = read("radar.json"); } catch { console.error("no radar.json"); process.exit(1); }
            const EXPECTED_SECTORS = 9;
            if (radar.sectors.length !== EXPECTED_SECTORS) {
              console.error("radar.json holds " + radar.sectors.length + " sector(s), expected " + EXPECTED_SECTORS);
              process.exit(1);
            }
            if (radar.inputSignalCount !== topics.inputSignalCount) {
              console.error(
                "radar.json was built from " + radar.inputSignalCount + " signal(s) while topics.json holds " +
                topics.inputSignalCount + " — radar.json is stale"
              );
              process.exit(1);
            }
            // Provenance, not signal count: two runs can hold the same number
            // of signals, so the count alone cannot tell a current radar.json
            // from a stale one (review finding F4). No apostrophes below this
            // line — the whole script is inside a shell single-quoted string.
            if (radar.sourceGeneratedAt !== topics.generatedAt) {
              console.error(
                "radar.json came from a topics.json generated at " + radar.sourceGeneratedAt +
                " but the current one was generated at " + topics.generatedAt + " — radar.json is stale"
              );
              process.exit(1);
            }
            const ringCount = Object.values(radar.summary || {}).reduce((a, b) => a + b, 0);
            if (ringCount !== radar.sectors.length) {
              console.error(
                "radar summary counts " + ringCount + " sector(s) but the radar holds " + radar.sectors.length
              );
              process.exit(1);
            }
            console.log("radar: " + radar.sectors.length + " sector(s) from " + radar.inputSignalCount + " signal(s)");
          '

      - name: Gate 2B
        # The repo has no test suite; this is the executable definition of
        # "2B works" (plan §7.1 / §8). It runs entirely on its own fixtures and
        # needs no secrets, so it still runs when the steps above failed.
        # Runs before the commit so a red gate cannot cost us the feeds.
        # The gate isolates its own output, so it no longer clobbers the real
        # signals.json that the clustering step just consumed.
        if: always()
        run: cd scripts && node gate-2b.js

      - name: Gate 3
        # Phase 3's executable definition (plan §7.1 / §8).
        if: always()
        run: cd scripts && node gate-3.js

      - name: Gate 4
        # Phase 4's executable definition (plan §7.1 / §8).
        if: always()
        run: cd scripts && node gate-4.js

      - name: Commit and push feeds
        # always(): the key-dependent step above fails while the repo has no
        # secrets, but the keyless feeds must still be committed.
        #
        # feed-rss.json is deliberately NOT in this list — it is a Fetch-layer
        # intermediate (gitignored), not a published artifact. Later steps in
        # this same job read it straight from the working tree.
        #
        # signals.json is absent by design: it is derived on every run and its
        # `text` would grow the repo (plan §2.2.1, board decision D3).
        # state-signals.json IS committed — cross-run dedup has to persist.
        #
        # topics.json IS committed: it is small and bounded, and its git history
        # is the per-topic weight series Phase 4 needs in order to compare a
        # topic across time (plan §5.1).
        #
        # radar.json IS committed for the same reason: it is a fixed nine
        # sectors, and its history is the only record of a topic moving between
        # rings, which is the thing a radar exists to show (phase 4 plan §5.3).
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-x.json feed-podcasts.json feed-blogs.json state-feed.json state-signals.json topics.json radar.json
          git diff --cached --quiet || git commit -m "chore: update feeds [skip ci]"
          git push
