name: Generate Feeds

on:
  schedule:
    # All feeds (tweets, podcasts, blogs): once daily at 6:17am UTC
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to fetch'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - tweets-only
          - podcasts-only
          - blogs-only

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      # Phase 2A: the rss and github channels need no secrets. This runs BEFORE
      # the key-dependent step below, which is expected to fail until the repo
      # has secrets — a later failure must not stop these feeds being produced.
      # Their outputs are Fetch-layer intermediates (gitignored), read by later
      # steps in this same job.
      - name: Fetch keyless channels
        run: cd scripts && node fetch-channels.js

      - name: Generate feeds
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          POD2TXT_API_KEY: ${{ secrets.POD2TXT_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "all" ]; then
            cd scripts && node generate-feed.js --${{ inputs.mode }}
          else
            cd scripts && node generate-feed.js
          fi

      - name: Normalize signals
        # always(): the key-dependent step above fails while the repo has no
        # secrets, but rss / github still produced feeds this run. A missing
        # feed file is skipped rather than fatal, so this step stays green and
        # whatever it does find wrong is visible in the log.
        if: always()
        run: cd scripts && node normalize-signals.js

      - name: Gate 2B
        # The repo has no test suite; this is the executable definition of
        # "2B works" (plan §7.1 / §8). It runs entirely on its own fixtures and
        # needs no secrets, so it still runs when the steps above failed.
        # Runs before the commit so a red gate cannot cost us the feeds.
        # Note: it overwrites the repo-root signals.json, which is gitignored
        # and not consumed by any later step.
        if: always()
        run: cd scripts && node gate-2b.js

      - name: Commit and push feeds
        # always(): the key-dependent step above fails while the repo has no
        # secrets, but the keyless feeds must still be committed.
        #
        # feed-rss.json is deliberately NOT in this list — it is a Fetch-layer
        # intermediate (gitignored), not a published artifact. Later steps in
        # this same job read it straight from the working tree.
        #
        # signals.json is absent by design: it is derived on every run and its
        # `text` would grow the repo (plan §2.2.1, board decision D3).
        # state-signals.json IS committed — cross-run dedup has to persist.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-x.json feed-podcasts.json feed-blogs.json state-feed.json state-signals.json
          git diff --cached --quiet || git commit -m "chore: update feeds [skip ci]"
          git push
